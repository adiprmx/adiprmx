<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ADIP RMX — code from phone, infinite ambition">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#f59e0b" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="#0d1117"/>
  <rect width="1280" height="360" fill="url(#grid)"/>

  <polygon points="96,40 116,40 76,320 56,320" fill="#f59e0b"/>

  <text x="150" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#f59e0b">// code from phone</text>

  <text x="146" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="102" font-weight="700" fill="#ffffff" letter-spacing="2">ADIP<tspan fill="#f59e0b"> RMX</tspan></text>

  <text x="150" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#8b949e">infinite ambition</text>

  <rect x="150" y="282" width="16" height="30" fill="#f59e0b">
    <animate attributeName="opacity" values="1;0;1;1" keyTimes="0;0.45;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(985, 70)">
    <rect x="0" y="0" width="150" height="220" rx="22" fill="none" stroke="#f59e0b" stroke-width="5"/>
    <rect x="58" y="12" width="34" height="8" rx="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="22" y="44" width="106" height="10" rx="5" fill="#c9d1d9" opacity="0.85"/>
    <rect x="22" y="66" width="80" height="10" rx="5" fill="#c9d1d9" opacity="0.5"/>
    <rect x="22" y="88" width="95" height="10" rx="5" fill="#c9d1d9" opacity="0.65"/>
    <rect x="22" y="110" width="60" height="10" rx="5" fill="#f59e0b" opacity="0.8"/>
    <rect x="22" y="132" width="88" height="10" rx="5" fill="#c9d1d9" opacity="0.4"/>
    <circle cx="75" cy="192" r="9" fill="none" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <g stroke="#f59e0b" stroke-width="3" opacity="0.45" fill="none">
    <path d="M20 50 V20 H50"/>
    <path d="M1230 50 V20 H1260"/>
    <path d="M20 310 V340 H50"/>
    <path d="M1230 310 V340 H1260"/>
